name: Self-host installation smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Prepare the isolated project
        run: |
          sed 's/replace-with-own-project-id/autosocials-self-host-ci/' release/supabase-config.example.toml > supabase/config.toml
          node release/prepare-migrations.mjs
      - name: Start Supabase and apply migrations to a clean database
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Verify local schema and the agent RLS boundary
        run: |
          docker exec supabase_db_autosocials-self-host-ci psql -U postgres -v ON_ERROR_STOP=1 -c "
            DO \$\$ BEGIN
              IF to_regclass('public.workspaces') IS NULL
                OR to_regclass('public.agent_api_oauth_tokens') IS NULL
                OR has_table_privilege('anon', 'public.agent_api_oauth_tokens', 'SELECT')
              THEN RAISE EXCEPTION 'Required schema or token isolation is missing'; END IF;
            END \$\$;"
      - name: Build and verify the application container and local Auth
        run: |
          set -euo pipefail
          status="$(supabase status -o env 2>/dev/null)"
          read_setting() {
            printf '%s\n' "$status" | sed -n "s/^$1=\(.*\)$/\1/p" | tr -d '"'
          }
          export SUPABASE_URL="$(read_setting API_URL)"
          export SUPABASE_PUBLISHABLE_KEY="$(read_setting ANON_KEY)"
          export SUPABASE_SERVICE_ROLE_KEY="$(read_setting SERVICE_ROLE_KEY)"
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_PUBLISHABLE_KEY" && test -n "$SUPABASE_SERVICE_ROLE_KEY"
          docker build -f release/Dockerfile -t autosocials-self-host-ci \
            --build-arg VITE_SUPABASE_URL="$SUPABASE_URL" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --build-arg VITE_SUPABASE_PROJECT_ID=autosocials-self-host-ci .
          docker run --rm --detach --name autosocials-self-host-ci --network host \
            -e SUPABASE_URL -e SUPABASE_PUBLISHABLE_KEY -e SUPABASE_SERVICE_ROLE_KEY \
            autosocials-self-host-ci >/dev/null
          curl --retry 8 --retry-delay 1 --retry-connrefused -fsS \
            http://127.0.0.1:3000/developers/self-hosting > "$RUNNER_TEMP/self-host-guide.html"
          grep -Fq 'Self-hosting checklist' "$RUNNER_TEMP/self-host-guide.html"
          test_email='selfhost-smoke@example.test'
          test_password="$(openssl rand -hex 16)"
          jq -nc --arg email "$test_email" --arg password "$test_password" \
            '{email: $email, password: $password, email_confirm: true}' |
            curl -fsS -X POST "$SUPABASE_URL/auth/v1/admin/users" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H 'Content-Type: application/json' --data-binary @- >/dev/null
          jq -nc --arg email "$test_email" --arg password "$test_password" '{email: $email, password: $password}' |
            curl -fsS -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json' --data-binary @- |
            jq -e '(.access_token | type) == "string"' >/dev/null
      - name: Stop the isolated project
        if: always()
        run: |
          docker rm -f autosocials-self-host-ci 2>/dev/null || true
          supabase stop --no-backup
